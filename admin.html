<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tush Phone - Owner Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;color:#172033;margin:0;padding:16px}
main{max-width:600px;margin:auto}
header,.panel{background:white;border-radius:14px;padding:20px;margin:14px 0}
header{background:#111827;color:white}
h1{font-size:24px}label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:8px}
input,select,textarea{border:1px solid #cbd5e1}
button{border:0;background:#f59e0b;font-weight:bold;margin-top:14px}
.status{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<header><h1>Tush Phone</h1><p>Private owner dashboard. Sign in to manage shop products.</p></header>
<section class="panel" id="loginPanel">
<h2>Owner sign in</h2>
<label for="email">Email</label><input id="email" type="email" autocomplete="username">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<button id="login">Sign in</button>
<button id="logout" class="hidden">Sign out</button>
<p id="authStatus" class="status">Add your Supabase settings to enable sign-in.</p>
</section>
<section class="panel hidden" id="productPanel">
<h2>Add product</h2>
<form id="productForm">
<label for="name">Product name</label><input id="name" maxlength="120" required>
<label for="price">Price (KSh)</label><input id="price" type="number" min="0" step="1" required>
<label for="category">Category</label>
<select id="category"><option>Smartphones</option><option>Accessories</option><option>Solar laptops</option><option>Fridges</option></select>
<label for="description">Description</label><textarea id="description" maxlength="1000"></textarea>
<label for="photo">Product photo (JPG, PNG or WebP, max 5 MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
<button id="save" type="submit">Save product</button>
<p id="saveStatus" class="status"></p>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Replace these two values with your own Supabase Project URL and publishable key. Never use a secret or service_role key. */
const SUPABASE_URL = "";
const SUPABASE_KEY = "sb_publishable__P1qM1yMQDtl9jRZ0Pr7NA_lcgiuBVv";
const ready = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_KEY.includes("PASTE_");
const el = id => document.getElementById(id);
let db = null;
if (ready) db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
else el("authStatus").textContent = "Setup required: replace the two Supabase placeholders in this file.";
function signedIn(on) {
 el("productPanel").classList.toggle("hidden",!on);
 el("logout").classList.toggle("hidden",!on);
 el("login").classList.toggle("hidden",on);
}
async function checkSession() {
 if (!db) return;
 const {data,error}=await db.auth.getSession();
 if(error) el("authStatus").textContent=error.message;
 signedIn(!!data.session);
 if(data.session) el("authStatus").textContent="Signed in as "+data.session.user.email;
}
el("login").addEventListener("click",async()=>{
 if(!db)return;
 const email=el("email").value.trim(),password=el("password").value;
 if(!email||!password){el("authStatus").textContent="Enter your email and password.";return;}
 el("authStatus").textContent="Signing in...";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error) el("authStatus").textContent="Sign-in failed: "+error.message;
 else await checkSession();
});
el("logout").addEventListener("click",async()=>{
 if(!db)return;
 const {error}=await db.auth.signOut();
 el("authStatus").textContent=error?"Sign-out failed: "+error.message:"Signed out.";
 signedIn(false);
});
el("productForm").addEventListener("submit",async event=>{
 event.preventDefault();
 if(!db){el("saveStatus").textContent="Add the Supabase URL and publishable key first.";return;}
 const {data:sessionData}=await db.auth.getSession();
 if(!sessionData.session){el("saveStatus").textContent="Please sign in again.";signedIn(false);return;}
 const name=el("name").value.trim(),price=Number(el("price").value),category=el("category").value,description=el("description").value.trim(),file=el("photo").files[0];
 if(!name||!Number.isFinite(price)||price<0||!file){el("saveStatus").textContent="Enter a name and valid price and choose a photo.";return;}
 if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5242880){el("saveStatus").textContent="Use a JPG, PNG or WebP photo up to 5 MB.";return;}
 el("save").disabled=true;el("saveStatus").textContent="Uploading photo...";
 const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-").slice(-80)||"photo";
 const path=Date.now()+"-"+crypto.randomUUID()+"-"+safe;
 const {error:uploadError}=await db.storage.from("product-images").upload(path,file,{upsert:false,contentType:file.type});
 if(uploadError){el("saveStatus").textContent="Photo upload failed: "+uploadError.message;el("save").disabled=false;return;}
 const {data:publicData}=db.storage.from("product-images").getPublicUrl(path);
 const {data:inserted,error}=await db.from("products").insert({name,price_kes:price,category,description,image_url:publicData.publicUrl,image_path:path}).select("id").single();
 if(error){await db.storage.from("product-images").remove([path]);el("saveStatus").textContent="Save failed: "+error.message;}
 else {el("productForm").reset();el("saveStatus").textContent="Product saved! The public shop still needs to be connected to display it.";}
 el("save").disabled=false;
});
checkSession();
</script>
</body>
</html>
