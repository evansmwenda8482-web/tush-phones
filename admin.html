<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tush Phone | Owner Admin</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-width: 400px;
      margin: 60px auto;
      padding: 24px;
      background: #202127;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #555; }
    button {
      background: #f5c542;
      color: #111;
      border: 0;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Tush Phone</h1>
    <h2>Owner Login</h2>
    <p>Sign in with your authorized owner account.</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Owner email" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>

    <p id="message" role="status"></p>
    <button id="logout" hidden>Sign Out</button>
  </div>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'PASTE_YOUR_PROJECT_URL';
    const SUPABASE_KEY = 'PASTE_YOUR_PUBLISHABLE_KEY';

    const message = document.getElementById('message');
    const form = document.getElementById('loginForm');
    const logout = document.getElementById('logout');

    if (
      SUPABASE_URL === 'PASTE_YOUR_PROJECT_URL' ||
      SUPABASE_KEY === 'PASTE_YOUR_PUBLISHABLE_KEY'
    ) {
      message.textContent =
        'Setup needed: add your Supabase project URL and publishable key.';
    } else {
      const supabase = createClient(
        SUPABASE_URL, SUPABASE_KEY
      );

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = 'Signing in...';

        const { error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        if (error) {
          message.textContent = 'Login failed. Check your credentials.';
          return;
        }

        const { data } = await supabase.auth.getUser();

        message.textContent = data.user
          ? 'Signed in. Owner authorization must be verified before managing products.'
          : 'Please sign in again.';
        logout.hidden = false;
      });

      logout.addEventListener('click', async () => {
        await supabase.auth.signOut();
        message.textContent = 'Signed out.';
        logout.hidden = true;
      });

      supabase.auth.getSession().then(({ data }) => {
        if (data.session) {
          message.textContent =
            'Session found. Verify owner permissions before managing products.';
          logout.hidden = false;
        }
      });
    }
  </script>
</body>
</html>
